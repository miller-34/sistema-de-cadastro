services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-crud_clientes}
      DB_USER: ${DB_USER:-crud_user}
      DB_PASSWORD: ${DB_PASSWORD:-crud_password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-crud_clientes}
      MARIADB_USER: ${DB_USER:-crud_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-crud_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./crud_clientes.sql:/docker-entrypoint-initdb.d/01-crud_clientes.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
